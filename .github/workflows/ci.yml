name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore SafeCare.slnx

      - name: Build
        run: dotnet build SafeCare.slnx -c Release --no-restore

      - name: Unit and integration tests
        # The runner provides Docker, so Testcontainers starts PostgreSQL unaided.
        run: dotnet test SafeCare.Tests/SafeCare.Tests.csproj -c Release --no-build

      - name: Vulnerable package scan
        # The command reports findings but always exits 0, so the output has to be inspected.
        # DOTNET_CLI_UI_LANGUAGE pins the CLI to English: on a non-English locale the SDK
        # emits a translated message instead, the grep below silently matches nothing, and
        # the gate fails open (green check, vulnerable packages shipped).
        env:
          DOTNET_CLI_UI_LANGUAGE: en
        run: |
          output=$(dotnet list SafeCare.slnx package --vulnerable --include-transitive)
          echo "$output"
          if echo "$output" | grep -q "has the following vulnerable packages"; then
            echo "::error::Vulnerable packages detected"
            exit 1
          fi

      - name: Check for pending EF model changes
        run: |
          # AppDbContextFactory reads appsettings.Development.json, which is gitignored.
          # has-pending-model-changes needs no live database, only a factory that constructs.
          cat > SafeCare/appsettings.Development.json <<'JSON'
          {
            "ConnectionStrings": {
              "DefaultConnection": "Host=localhost;Port=5432;Database=SafeCare;Username=postgres;Password=postgres"
            }
          }
          JSON
          dotnet tool install --global dotnet-ef
          # NOTE: -c here means --context (DbContext name) to the ef CLI, not --configuration -
          # `-c Release` fails with "No DbContext named 'Release' was found." Verified locally.
          dotnet ef migrations has-pending-model-changes --project SafeCare --no-build --configuration Release

      - name: Format check
        # Scoped to analyzer-driven rules (not whitespace/style) at --severity warn. This
        # deliberately does NOT cover the pre-existing whitespace/BOM/using-directive drift
        # that full-strictness `dotnet format SafeCare.slnx --verify-no-changes` would flag
        # across the tree - that predates this branch and is not this task's tree to
        # reformat. `--severity error` was tried first and found nothing, because
        # .editorconfig has zero `= error` entries: a gate that can never fire is worse than
        # no gate, so this runs at `warn` instead, which is clean after suppressing
        # xUnit1051 (CancellationToken not threaded through tests - a separate, project-wide
        # decision, see .editorconfig) and still catches newly introduced analyzer warnings.
        run: dotnet format SafeCare.slnx --verify-no-changes analyzers --severity warn

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # TEMPORARY: this job has never produced a green run - the E2E scenario tests (plan
    # tasks 18-22) are not implemented yet, so there is nothing here to pass. Without
    # continue-on-error, merging to main would be hard-gated on a job that cannot succeed.
    # Remove this flag once those tasks land and the job has a green run.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        # SafeCare.E2ETests is run with --no-build below, so it must exist beforehand.
        run: dotnet build SafeCare.slnx -c Release

      - name: Publish SafeCare app
        # AppFixture launches the app from the Release *publish* output at
        # SafeCare/bin/Release/net10.0/publish/SafeCare.dll, not via `dotnet run --no-build`:
        # launchSettings.json silently overrides ASPNETCORE_ENVIRONMENT/the port even when
        # they're set on the process, and MapStaticAssets() only serves build-output static
        # assets when the environment is literally "Development" (500s under "Testing"
        # otherwise). See SafeCare.E2ETests/Infrastructure/AppFixture.cs. --no-build reuses
        # the build from the previous step.
        run: dotnet publish SafeCare/SafeCare.csproj -c Release --no-build

      - name: Install Playwright browsers
        run: pwsh SafeCare.E2ETests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Run E2E tests
        run: dotnet test SafeCare.E2ETests/SafeCare.E2ETests.csproj -c Release --no-build

      - name: Upload Playwright traces
        # E2ETestBase starts a trace on every browser context it opens (see
        # SafeCare.E2ETests/Infrastructure/E2ETestBase.cs) and exports it to this exact
        # directory when the test instance is disposed, so the files below always exist once
        # any E2E test has run. Without these a browser failure on someone else's machine is
        # guesswork. This step still only fires when the run failed, so a green job never
        # uploads anything - if-no-files-found is "warn" rather than "ignore" because on a
        # failing run the directory should never actually be empty; a warning surfaces the
        # rare case (e.g. the test host crashing before a trace could be exported) instead of
        # going quiet about it again.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: SafeCare.E2ETests/bin/Release/net10.0/playwright-traces
          if-no-files-found: warn
